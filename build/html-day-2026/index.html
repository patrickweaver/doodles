<body>
    
<h1>HTML Day 2026</h1>

<p>
    For HTML Day 2026 I decided to create some new HTML tags <a href="https://www.patrickweaver.net/blog/a-blog-post-with-every-html-element/" target="blank">already used all of the exiisting tags</a>.
</p>


<h2><pre>&lt;spongebob&gt;</pre></h2>
<spongebob>
sometimes it's fun to write like a spongebob
</spongebob>


<script defer>

console.log("hello HTML Day")

function spongebobify(root = document) {
  root.querySelectorAll('spongebob').forEach(el => {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let i = 0, node;
    while ((node = walker.nextNode())) {
      node.nodeValue = node.nodeValue.replace(/\p{L}/gu, ch =>
        i++ % 2 ? ch.toUpperCase() : ch.toLowerCase()
      );
    }
  });
}

document.addEventListener('DOMContentLoaded', () => spongebobify());



</script>
</body>
</html>
